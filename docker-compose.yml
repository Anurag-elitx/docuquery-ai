version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/docuquery
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-dummy-openai-key}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-dummy-gemini-key}
      - FAISS_INDEX_PATH=/app/faiss_data/faiss_index
    volumes:
      - ./faiss_data:/app/faiss_data
      - ./uploads:/app/uploads
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docuquery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
